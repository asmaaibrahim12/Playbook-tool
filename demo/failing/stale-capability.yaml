# Deliberately broken. Five separate problems, only one of which is about
# documentation. Run: python3 tools/validate.py demo/failing
apiVersion: capability.taxfix.internal/v1
kind: Capability

metadata:
  name: receipt-matching
  title: Receipt Matching
  trunk: data-and-docs
  owner: "#trunk-data-and-docs"
  summary: Matches receipts to bank transactions.
  lifecycle: stable          # PROBLEM 3: stable, but consumers can't run the eval

scope:
  does:
    - Match a receipt to a bank transaction
  does_not:
    - Handle foreign currency

build_your_own_if:
  - You need real-time matching inside a live user flow

# PROBLEM 2: claims L2 — "you build on it without us" — while can_run_eval is
# false. You cannot hand a team self-service on a capability only you can
# prove works. This is the rung nobody can skip.
# PROBLEM 4: can_contribute closed, with two Orchards depending on it. That is
# the definition of a service desk.
self_service:
  level: L2
  can_run_eval: false
  can_contribute: closed

availability:
  markets:
    - market: DE
      status: live
      obligation: EÜR
      channel: ELSTER

evaluation:
  method: Labelled match set, scored on exact transaction match.
  metrics:
    - name: match_accuracy
      value: 0.88
      measured_on: DE set
      as_of: "2025-01-10"    # PROBLEM 1: well past the 180-day freshness limit
      source: assumed
  # PROBLEM 5: blocking consumer below, but no human_fallback declared

cost:
  unit: per receipt
  measure: Cost per matched receipt.
  source: assumed
  as_of: "2026-09-30"

interface:
  protocol: http
  entrypoint: https://api.internal.taxfix/data-docs/v1/match

consumers:
  - orchard: business
    market: DE
    since: "2026-03-18"
    criticality: blocking
  - orchard: self-serve
    market: DE
    since: "2025-06-01"
    criticality: important

support:
  channel: "#trunk-data-and-docs"
